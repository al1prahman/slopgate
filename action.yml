name: 'slopgate'
description: 'Block hallucinated dependencies and leaked secrets — SARIF annotations on the PR diff plus a summary comment'
inputs:
  range:
    description: 'Git range to scan. Defaults to the PR merge-base (origin/<base>...HEAD), or the last commit on push events.'
    required: false
    default: ''
  mode:
    description: 'slopgate mode — block | warn | off'
    required: false
    default: 'block'
  comment:
    description: 'Post or update a PR comment with the findings'
    required: false
    default: 'true'
  token:
    description: 'Token used for the PR comment. Needs pull-requests: write on the calling workflow.'
    required: false
    default: ${{ github.token }}
  version:
    description: 'slopgate version to run'
    required: false
    default: 'latest'
outputs:
  verdict:
    description: 'pass | warn | block'
    value: ${{ steps.scan.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Scan
      id: scan
      continue-on-error: true
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        RANGE: ${{ inputs.range }}
        VERSION: ${{ inputs.version }}
      run: |
        set +e
        if [ -z "$RANGE" ]; then
          if [ -n "$GITHUB_BASE_REF" ]; then
            RANGE="origin/$GITHUB_BASE_REF...HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
        fi
        npx --yes "slopgate@$VERSION" scan --range "$RANGE" --mode "$MODE" --format sarif > results.sarif
        code=$?
        set -e
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if grep -q '"level": "error"' results.sarif 2>/dev/null; then
          echo "verdict=block" >> "$GITHUB_OUTPUT"
        elif grep -q '"level": "warning"' results.sarif 2>/dev/null; then
          echo "verdict=warn" >> "$GITHUB_OUTPUT"
        else
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload SARIF
      if: always() && hashFiles('results.sarif') != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

    - name: Comment on the PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && hashFiles('results.sarif') != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const sarif = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
          const results = (sarif.runs && sarif.runs[0] && sarif.runs[0].results) || [];
          const marker = '<!-- slopgate-report -->';
          const icon = { error: '❌', warning: '⚠️', note: 'ℹ️' };
          let body;
          if (results.length === 0) {
            body = marker + '\n## slopgate: clean ✅\n\nNo secrets, hallucinated dependencies, or suspicious imports in this diff.';
          } else {
            const rows = results.map((r) => {
              const location = (r.locations && r.locations[0] && r.locations[0].physicalLocation) || {};
              const uri = (location.artifactLocation && location.artifactLocation.uri) || '?';
              const line = (location.region && location.region.startLine) || '';
              const text = String(r.message.text).replace(/\|/g, '\\|').replace(/\n/g, ' ');
              return '| ' + (icon[r.level] || '•') + ' | `' + r.ruleId + '` | `' + uri + ':' + line + '` | ' + text + ' |';
            }).join('\n');
            const blocked = results.some((r) => r.level === 'error');
            body = marker + '\n## slopgate: ' + (blocked ? 'blocked ❌' : 'warnings ⚠️') + '\n\n'
              + '| | rule | location | finding |\n|---|---|---|---|\n' + rows;
          }
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 },
          );
          const existing = comments.find((comment) => comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on blocking findings
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.code }}
      run: |
        if [ ! -s results.sarif ]; then
          echo "::error::slopgate produced no report — the scan did not run"
          exit 1
        fi
        if [ "$CODE" = "2" ]; then
          echo "::error::slopgate found blocking findings — see the PR annotations"
          exit 1
        fi
